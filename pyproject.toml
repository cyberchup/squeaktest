[project]
name = "squeaktest"
version = "0.1.0.dev0"
description = "Deepfake voice detector with calibrated, probabilistic output, built for SOC triage."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dylan Wood" }]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.33.0",
    "numpy>=2.5.3",
    "safetensors>=0.8.0",
    "torch>=2.14.1",
    "transformers>=5.18.0",
]
keywords = ["deepfake", "audio", "anti-spoofing", "security", "detection-engineering"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]

[project.scripts]
squeaktest = "squeaktest.cli:main"

[project.urls]
Repository = "https://github.com/cyberchup/squeaktest"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use plain asserts and call ffmpeg to generate synthetic fixtures.
"tests/**" = ["S101", "S603"]
# Developer scripts run tools like uv by name, with fixed arguments.
"scripts/**" = ["S603", "S607"]
# The eval harness seeds random for reproducible splits and runs ffmpeg on dataset files.
"eval/**" = ["S311", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]  # lets tests import the eval harness (eval/)

# PyTorch: CUDA builds on Windows (local development on an NVIDIA GPU), CPU-only builds
# elsewhere, so CI and CPU hosting don't download gigabytes of unused GPU libraries.
[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
eval = [
    "matplotlib>=3.11.2",
]
