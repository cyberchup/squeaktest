name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs so a moved tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # libavcodec-extra adds the AMR-NB encoder the eval harness uses for the mobile-call
      # condition; Ubuntu's standard ffmpeg build leaves it out.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libavcodec-extra
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check
      - name: Tests
        run: uv run pytest
      - name: Bandit
        run: uv run bandit -r src
      - name: pip-audit (all locked dependencies, PyTorch included)
        run: uv run python scripts/audit_deps.py

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # WEIGHTS=mounted keeps the 1.27 GB model out of CI; the smoke test doesn't need it.
      - name: Build the image
        run: docker build --build-arg WEIGHTS=mounted -t squeaktest:ci .
      - name: Smoke-test the image
        run: sh scripts/check_image.sh docker squeaktest:ci
